    <div class="app" x-data>
      <!-- Custom chrome: Electrobun will host this frameless. -->
      <header class="titlebar">
        <div class="titlebar__brand">
          <svg class="titlebar__logo" aria-hidden="true"><use href="#nishi-mark" /></svg>
          <span class="titlebar__wordmark">Nishi</span>
          <span class="titlebar__version" id="version-badge">0.2.1</span>
        </div>
        <div class="titlebar__title" id="window-title">Nishi</div>
        <div class="titlebar__controls">
          <button class="wc" data-window-action="minimize" title="Minimize" aria-label="Minimize">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-minus" /></svg>
          </button>
          <button class="wc" data-window-action="maximize" title="Maximize" aria-label="Maximize">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-square" /></svg>
          </button>
          <button class="wc wc--close" data-window-action="close" title="Close" aria-label="Close">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>
      </header>

      <div class="body" :class="{ 'body--no-sidebar': !$store.ui.sidebarVisible }">
        <nav class="activitybar" aria-label="Activity">
          <button
            class="ab"
            :class="{ 'is-active': $store.ui.sidebarVisible && $store.ui.sidebarPanel === 'explorer' }"
            @click="$store.ui.showPanel('explorer')"
            title="Explorer (Ctrl+B)"
            aria-label="Explorer"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-folder-tree" /></svg>
          </button>
          <button
            class="ab"
            @click="window.dispatchEvent(new CustomEvent('nishi:find'))"
            title="Find in file (Ctrl+F)"
            aria-label="Find"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
          </button>
          <button
            class="ab"
            :class="{ 'is-active': $store.ui.sidebarVisible && $store.ui.sidebarPanel === 'extensions' }"
            @click="$store.ui.showPanel('extensions')"
            title="Extensions — Stage 4"
            aria-label="Extensions"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-blocks" /></svg>
          </button>
          <button
            class="ab ab--bottom"
            :class="{ 'is-active': $store.ui.sidebarVisible && $store.ui.sidebarPanel === 'settings' }"
            @click="$store.ui.showPanel('settings')"
            title="Settings (Ctrl+,)"
            aria-label="Settings"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
          </button>
        </nav>

        <aside class="sidebar" x-show="$store.ui.sidebarVisible" aria-label="Side panel">
          <!-- Explorer -->
          <div class="panel" x-data="explorer" x-show="$store.ui.sidebarPanel === 'explorer'">
            <div class="panel__header">
              <span class="panel__title" x-text="rootName || 'Explorer'"></span>
              <div class="panel__actions">
                <button @click="create('file')" title="New file"><svg class="icon" aria-hidden="true"><use href="#i-file-plus" /></svg></button>
                <button @click="create('directory')" title="New folder"><svg class="icon" aria-hidden="true"><use href="#i-folder-plus" /></svg></button>
                <button @click="refresh()" title="Refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh-cw" /></svg></button>
                <button @click="openFolder()" title="Open folder"><svg class="icon" aria-hidden="true"><use href="#i-ellipsis" /></svg></button>
              </div>
            </div>

            <p class="panel__error" x-show="error" x-text="error"></p>
            <p class="panel__hint" x-show="loading">Reading folder…</p>

            <ul class="tree" role="tree">
              <template x-for="(row, index) in rows" :key="row.path">
                <li
                  class="tree__row"
                  :class="{ 'tree__row--dir': row.kind === 'directory' }"
                  :style="`padding-left: ${8 + row.depth * 13}px`"
                  role="treeitem"
                >
                  <button class="tree__main" @click="toggle(index)" :title="row.path">
                    <svg class="tree__chevron" aria-hidden="true" x-show="row.kind === 'directory'">
                      <use :href="row.expanded ? '#i-chevron-down' : '#i-chevron-right'" />
                    </svg>
                    <span class="tree__chevron tree__chevron--spacer" x-show="row.kind === 'file'"></span>
                    <svg class="tree__icon" :class="{ 'tree__icon--dir': row.kind === 'directory' }" aria-hidden="true">
                      <use :href="iconFor(row)" />
                    </svg>
                    <span class="tree__name" x-text="row.name"></span>
                  </button>
                  <span class="tree__actions">
                    <button @click.stop="rename(index)" title="Rename"><svg class="icon" aria-hidden="true"><use href="#i-pencil" /></svg></button>
                    <button @click.stop="remove(index)" title="Delete"><svg class="icon" aria-hidden="true"><use href="#i-trash-2" /></svg></button>
                  </span>
                </li>
              </template>
            </ul>

            <p class="panel__hint" x-show="!loading && rows.length === 0 && !error">
              This folder is empty.
            </p>
          </div>

          <!-- Settings -->
          <div class="panel" x-data="settingsPane" x-show="$store.ui.sidebarPanel === 'settings'">
            <div class="panel__header"><span class="panel__title">Settings</span></div>
            <div class="settings">
              <template x-for="group in groups" :key="group.name">
                <section class="settings__group">
                  <h3 x-text="group.name"></h3>
                  <template x-for="spec in group.specs" :key="spec.key">
                    <div class="setting">
                      <div class="setting__row">
                        <label class="setting__label" :for="spec.key" x-text="spec.label"></label>

                        <input
                          x-show="spec.kind === 'boolean'"
                          type="checkbox"
                          :id="spec.key"
                          :checked="values[spec.key]"
                          @change="update(spec, $event)"
                        />
                        <input
                          x-show="spec.kind === 'number'"
                          type="number"
                          class="setting__number"
                          :id="spec.key"
                          :min="spec.min"
                          :max="spec.max"
                          :value="values[spec.key]"
                          @change="update(spec, $event)"
                        />
                        <select
                          x-show="spec.kind === 'enum'"
                          class="setting__select"
                          :id="spec.key"
                          @change="update(spec, $event)"
                        >
                          <template x-for="option in (spec.options || [])" :key="option">
                            <option :value="option" :selected="values[spec.key] === option" x-text="option"></option>
                          </template>
                        </select>
                      </div>
                      <p class="setting__description" x-text="spec.description"></p>
                      <button
                        class="setting__reset"
                        x-show="!isDefault(spec)"
                        @click="reset(spec)"
                      >Reset to default</button>
                    </div>
                  </template>
                </section>
              </template>
            </div>
          </div>

          <!-- Extensions (Stage 4) -->
          <div class="panel" x-show="$store.ui.sidebarPanel === 'extensions'">
            <div class="panel__header"><span class="panel__title">Extensions</span></div>
            <p class="panel__hint">
              The VSCode-compatible extension host arrives in <strong>Stage 4</strong>.
              This panel is its mount point.
            </p>
          </div>

          <div class="sidebar__footer">
            <span class="dot" :class="{ 'is-live': $store.ui.hostReady }"></span>
            <span x-text="$store.ui.hostLabel"></span>
          </div>
        </aside>

        <main class="editor-area">
          <!-- Panes are rendered imperatively by editor-view.ts -->
          <div class="panes" id="panes"></div>

          <!-- Find / replace -->
          <div class="findbar" x-data="findBar" x-show="$store.ui.findOpen" @keydown.escape="close()">
            <div class="findbar__row">
              <button class="findbar__toggle" @click="showReplace = !showReplace"
                :title="showReplace ? 'Hide replace' : 'Show replace'">
                <svg class="icon" aria-hidden="true">
                  <use :href="showReplace ? '#i-chevron-down' : '#i-chevron-right'" />
                </svg>
              </button>
              <input
                id="find-input"
                class="findbar__input"
                type="text"
                placeholder="Find"
                x-model="options.query"
                @input="run()"
                @keydown.enter.prevent="$event.shiftKey ? previous() : next()"
              />
              <div class="findbar__opts">
                <button :class="{ 'is-on': options.caseSensitive }"
                  @click="options.caseSensitive = !options.caseSensitive; run()" title="Match case"><svg class="icon" aria-hidden="true"><use href="#i-case-sensitive" /></svg></button>
                <button :class="{ 'is-on': options.wholeWord }"
                  @click="options.wholeWord = !options.wholeWord; run()" title="Whole word"><svg class="icon" aria-hidden="true"><use href="#i-whole-word" /></svg></button>
                <button :class="{ 'is-on': options.regex }"
                  @click="options.regex = !options.regex; run()" title="Regular expression"><svg class="icon" aria-hidden="true"><use href="#i-regex" /></svg></button>
              </div>
              <span class="findbar__summary" x-text="summary"></span>
              <button class="findbar__nav" @click="previous()" title="Previous (Shift+Enter)"><svg class="icon" aria-hidden="true"><use href="#i-arrow-up" /></svg></button>
              <button class="findbar__nav" @click="next()" title="Next (Enter)"><svg class="icon" aria-hidden="true"><use href="#i-arrow-down" /></svg></button>
              <button class="findbar__nav" @click="close()" title="Close (Esc)"><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
            </div>

            <div class="findbar__row" x-show="showReplace">
              <span class="findbar__toggle"></span>
              <input
                class="findbar__input"
                type="text"
                placeholder="Replace"
                x-model="replacement"
                @keydown.enter.prevent="replaceCurrent()"
              />
              <button class="findbar__button" @click="replaceCurrent()">Replace</button>
              <button class="findbar__button" @click="replaceEvery()">Replace all</button>
            </div>
          </div>

          <footer class="statusbar">
            <span class="statusbar__item" :class="{ 'is-error': $store.ui.statusTone === 'error' }"
              x-text="$store.ui.status"></span>
            <span class="statusbar__spacer"></span>
            <span class="statusbar__item" x-show="$store.ui.dirtyCount > 0"
              x-text="`${$store.ui.dirtyCount} unsaved`"></span>
            <span class="statusbar__item" x-show="$store.ui.selected > 0"
              x-text="`${$store.ui.selected} selected`"></span>
            <span class="statusbar__item" x-show="$store.ui.cursor" x-text="$store.ui.cursor"></span>
            <span class="statusbar__item" x-show="$store.ui.eol" x-text="$store.ui.eol"></span>
            <span class="statusbar__item" x-text="$store.ui.language"></span>
          </footer>
        </main>
      </div>
    </div>

    <!-- Cloned into every pane with no document open. -->
    <template id="welcome-template">
      <article class="welcome">
        <div class="welcome__mark">
          <svg class="welcome__logo" aria-hidden="true"><use href="#nishi-mark" /></svg>
        </div>
        <h1 class="welcome__title">Nishi</h1>
        <p class="welcome__sub">
          <em>nishi</em> — निशा / নিশি, night.
          A modern resurrection of Atom, on Electrobun&nbsp;+&nbsp;Bun.
        </p>
        <ul class="welcome__keys">
          <li><kbd>Ctrl</kbd><kbd>N</kbd><span>New buffer</span></li>
          <li><kbd>Ctrl</kbd><kbd>S</kbd><span>Save</span></li>
          <li><kbd>Ctrl</kbd><kbd>F</kbd><span>Find</span></li>
          <li><kbd>Ctrl</kbd><kbd>H</kbd><span>Replace</span></li>
          <li><kbd>Ctrl</kbd><kbd>\</kbd><span>Split editor</span></li>
          <li><kbd>Ctrl</kbd><kbd>B</kbd><span>Toggle sidebar</span></li>
        </ul>
        <p class="welcome__hint">Pick a file from the explorer to start editing.</p>
      </article>
    </template>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
